<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Image Viewer 2</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #121212;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    color: #fff;
  }

  .viewer {
    position: relative;
    width: min(90vw, 480px);
  }

  .stage {
    width: 100%;
    aspect-ratio: 9 / 16;
    background: #000;
    border-radius: 12px;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .stage img {
    max-width: 100%;
    max-height: 100%;
    object-fit: contain;
  }

  .counter {
    margin-top: 12px;
    text-align: center;
    font-size: 14px;
    color: rgba(255, 255, 255, .6);
  }

  /* ---- Nút điều hướng lên / xuống ---- */
  .DivFeedNavigationContainer {
    top: 50%;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .TUXButton {
    width: 48px;
    height: 48px;
    padding: 0;
    border: none;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 50%;
    background: rgba(255, 255, 255, .08);
    color: #fff;
    transition: background .2s;
  }

  .TUXButton:hover:not(:disabled) { background: rgba(255, 255, 255, .18); }

  .TUXButton--disabled,
  .TUXButton:disabled {
    opacity: .34;
    cursor: not-allowed;
  }

  .TUXButton-content,
  .TUXButton-iconContainer {
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .TUXButton-iconContainer svg { font-size: 24px; }
</style>
</head>
<body>

<div class="viewer">
  <div class="stage">
    <img id="photo" alt="">
  </div>
  <div class="counter"><span id="current">1</span> / <span id="total">0</span></div>

  <div class="DivFeedNavigationContainer" style="position: absolute; transform: translateY(-50%) translateX(100%); justify-content: center; inset-inline-end: -1rem; inset-inline-start: unset;">
    <div class="css-1dux0b3">
      <button class="TUXButton TUXButton--capsule TUXButton--medium TUXButton--secondary TUXButton--disabled action-item" aria-disabled="true" disabled="" type="button" data-e2e="feed-navigation-prev">
        <div class="TUXButton-content">
          <div class="TUXButton-iconContainer">
            <svg fill="currentColor" viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg" width="1em" height="1em"><path d="m24 19.25 13.67 13.67a1 1 0 0 0 1.41 0l1.84-1.84a1 1 0 0 0 0-1.41L24.71 13.46a1 1 0 0 0-1.42 0L7.1 29.66a1 1 0 0 0 0 1.42l1.83 1.84a1 1 0 0 0 1.41 0L24 19.25Z"></path></svg>
          </div>
        </div>
      </button>
    </div>
    <div class="css-1dux0b3">
      <button class="TUXButton TUXButton--capsule TUXButton--medium TUXButton--secondary action-item" aria-disabled="false" type="button" data-e2e="feed-navigation-next">
        <div class="TUXButton-content">
          <div class="TUXButton-iconContainer">
            <svg fill="currentColor" viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg" width="1em" height="1em"><path d="m24 28.75 13.67-13.67a1 1 0 0 1 1.41 0l1.84 1.84a1 1 0 0 1 0 1.41L24.71 34.54a1 1 0 0 1-1.42 0L7.1 18.34a1 1 0 0 1 0-1.42l1.83-1.84a1 1 0 0 1 1.41 0L24 28.75Z"></path></svg>
          </div>
        </div>
      </button>
    </div>
  </div>
</div>

<script>
  const images = [
    "image2/1785859119938_1581862425717979058_2674256064647096413_5fff9083ddb942209788adc25f41df2a.jpg",
    "image2/1785859119956_1581862425717979058_2674256064647096413_653b2769c9ef4c896fb78ef1b5e5bd3f.jpg",
    "image2/1785859119969_1581862425717979058_2674256064647096413_d2429df220fffaafaec900c5abc8a60f.jpg",
    "image2/1785859119981_1581862425717979058_2674256064647096413_c1784dd34bcb164503960083d7e2eb34.jpg",
    "image2/1785859119993_1581862425717979058_2674256064647096413_214131e99c95d06afc8b1cb4cde78998.jpg",
    "image2/1785859120004_1581862425717979058_2674256064647096413_b62a74a5facb97233c5e423a49d64259.jpg",
    "image2/1785859120014_1581862425717979058_2674256064647096413_7ea9d1784e19d55ff0ec5bc1ad55fa77.jpg"
  ];

  const photo = document.getElementById("photo");
  const currentEl = document.getElementById("current");
  const prevBtn = document.querySelector('[data-e2e="feed-navigation-prev"]');
  const nextBtn = document.querySelector('[data-e2e="feed-navigation-next"]');

  let index = 0;
  document.getElementById("total").textContent = images.length;

  function setDisabled(btn, disabled) {
    btn.disabled = disabled;
    btn.setAttribute("aria-disabled", String(disabled));
    btn.classList.toggle("TUXButton--disabled", disabled);
  }

  function render() {
    photo.src = images[index];
    photo.alt = "Ảnh " + (index + 1);
    currentEl.textContent = index + 1;
    setDisabled(prevBtn, index === 0);
    setDisabled(nextBtn, index === images.length - 1);
  }

  function go(step) {
    const next = index + step;
    if (next < 0 || next >= images.length) return;
    index = next;
    render();
  }

  prevBtn.addEventListener("click", () => go(-1));
  nextBtn.addEventListener("click", () => go(1));

  document.addEventListener("keydown", (e) => {
    if (e.key === "ArrowUp") go(-1);
    if (e.key === "ArrowDown") go(1);
  });

  render();
</script>

</body>
</html>
