services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: tds
      POSTGRES_PASSWORD: tds
      POSTGRES_DB: tds_assistant
    ports:
      - "5432:5432"
    volumes:
      - tds_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tds -d tds_assistant"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  tds_postgres_data:
